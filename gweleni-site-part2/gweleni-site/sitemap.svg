  <text x="285" y="266" text-anchor="middle" font-size="10" fill="#626C78">FAQ</text>

  <!-- Home (repeat ref) -->
  <rect x="375" y="190" width="160" height="90" rx="6" fill="#FFFFFF" stroke="#C98700" stroke-width="1.5"/>
