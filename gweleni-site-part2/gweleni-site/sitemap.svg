  <text x="450" y="350" text-anchor="middle" font-size="11.5" fill="#626C78">The Home page links out to all four other pages; all pages link back to Home.</text>

  <!-- Nav bar mini-diagram -->
  <rect x="150" y="380" width="600" height="56" rx="6" fill="#101922"/>
  <text x="180" y="413" font-size="12" fill="#FFFFFF">Home</text>
  <text x="260" y="413" font-size="12" fill="#FFFFFF">About Us</text>
  <text x="360" y="413" font-size="12" fill="#FFFFFF">Services</text>
  <text x="460" y="413" font-size="12" fill="#FFFFFF">Enquiry</text>
  <text x="555" y="413" font-size="12" fill="#FFFFFF">Contact</text>
  <rect x="640" y="393" width="90" height="28" rx="3" fill="#F0A800"/>
  <text x="685" y="412" text-anchor="middle" font-size="10.5" font-weight="700" fill="#101922">Get a Quote</text>
  <text x="450" y="452" text-anchor="middle" font-size="10.5" fill="#626C78">Main navigation shown on every page</text>
