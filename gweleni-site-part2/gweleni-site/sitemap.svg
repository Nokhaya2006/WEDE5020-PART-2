  <line x1="115" y1="160" x2="785" y2="160" stroke="#626C78" stroke-width="2"/>
  <line x1="115" y1="160" x2="115" y2="190" stroke="#626C78" stroke-width="2"/>
  <line x1="285" y1="160" x2="285" y2="190" stroke="#626C78" stroke-width="2"/>
  <line x1="455" y1="160" x2="455" y2="190" stroke="#626C78" stroke-width="2"/>
  <line x1="625" y1="160" x2="625" y2="190" stroke="#626C78" stroke-width="2"/>
